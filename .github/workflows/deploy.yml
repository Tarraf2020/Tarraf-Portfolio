name: Deploy to GitHub Pages

# dist/ is gitignored on purpose, so Pages builds from source on every push to
# main rather than serving a committed build that can drift from the code.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, because the build reads it: sitemap.xml takes each
          # URL's <lastmod> from the last commit that touched that file. The
          # default shallow clone has only the tip commit, so every file would
          # report the same date and the per-file signal would be lost.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `npm run build` is tsc --noEmit && vite build: a type error fails the
      # deploy instead of shipping past it.
      - run: npm run build
      # Requires Pages to already be on, with Settings > Pages > Source set to
      # "GitHub Actions". This action can only read the Pages site, not create
      # one: `enablement: true` fails as "Resource not accessible by
      # integration" because the default GITHUB_TOKEN can't create it.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
